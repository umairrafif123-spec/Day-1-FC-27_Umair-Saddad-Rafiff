<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Student Task Planner untuk membantu mahasiswa mengatur tugas dan deadline.">
  <title>Student Task Planner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="hero">
      <div class="hero-top">
        <span class="eyebrow">STUDENT PRODUCTIVITY</span>
        <span class="date-pill" id="todayLabel">Hari ini</span>
      </div>
      <h1>Student Task Planner<span>.</span></h1>
      <p>Atur tugas, pantau deadline, dan selesaikan semuanya satu per satu.</p>
      <div class="summary" aria-label="Ringkasan tugas">
        <div class="summary-card">
          <span class="summary-number" id="totalCount">0</span>
          <span class="summary-label">Total tugas</span>
        </div>
        <div class="summary-card">
          <span class="summary-number" id="pendingCount">0</span>
          <span class="summary-label">Belum selesai</span>
        </div>
        <div class="summary-card">
          <span class="summary-number" id="completedCount">0</span>
          <span class="summary-label">Selesai</span>
        </div>
      </div>
    </header>

    <section class="planner">
      <div class="section-heading">
        <div>
          <span class="eyebrow">YOUR WORKSPACE</span>
          <h2>Daftar Tugas</h2>
        </div>
        <span class="task-total" id="visibleCount">0 tugas</span>
      </div>

      <nav class="filters" aria-label="Filter tugas">
        <button class="filter-btn active" data-filter="all" type="button">Semua</button>
        <button class="filter-btn" data-filter="pending" type="button">Pending</button>
        <button class="filter-btn" data-filter="completed" type="button">Completed</button>
      </nav>

      <div class="task-list" id="taskList" aria-live="polite"></div>
      <p class="footer-note">Konsisten sedikit demi sedikit. Kamu pasti bisa! ✨</p>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
